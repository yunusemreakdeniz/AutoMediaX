name: AutoMediaX Android Auto APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automediax-android-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate AutoMediaX
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: 'true'
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
      APP_ID: com.automediax.player
      EXPECTED_PACKAGE: com.automediax.player.auto.debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key when configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FERMATAX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_USER_HOME"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
            chmod 600 "$ANDROID_USER_HOME/debug.keystore"
          else
            echo '::warning::No signing secret. APK may not update an older installation.'
          fi

      - name: Build universal Android Auto APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew verifyWebOnlyProductionGraph :fermata:packageAutoDebugUniversalApk \
            -PAPP_ID="$APP_ID" -PAPP_NAME=AutoMediaX \
            --no-daemon --stacktrace --console=plain

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -d '' apks < <(find fermata/build/outputs/apk_from_bundle/autoDebug \
            -type f -name '*-universal.apk' -print0)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected one universal APK, found ${#apks[@]}"
            exit 1
          fi
          version=$(sed -n 's/^appVersionName = "\([^"]*\)"/\1/p' gradle/libs.versions.toml | head -n 1)
          [[ -n "$version" ]] || { echo '::error::Missing version'; exit 1; }
          apk="dist/AutoMediaX-${version}-AndroidAuto.apk"
          cp "${apks[0]}" "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee dist/signature.txt
          "$build_tools/aapt" dump badging "$apk" | tee dist/badging.txt
          "$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml > dist/manifest.txt
          grep -F "package: name='$EXPECTED_PACKAGE'" dist/badging.txt
          grep -F 'me.app.fermatax.auto.CarService' dist/manifest.txt
          grep -F 'com.google.android.gms.car.category.CATEGORY_PROJECTION' dist/manifest.txt
          grep -F 'com.google.android.gms.car.application' dist/manifest.txt
          grep -F 'me.app.fermatax.auto.PhoneLauncherActivity' dist/manifest.txt
          grep -F 'me.app.fermatax.auto.AutoFermataMediaService' dist/manifest.txt
          if grep -Fq 'application-debuggable' dist/badging.txt; then
            echo '::error::Debuggable APK is not allowed'
            exit 1
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "### AutoMediaX APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: $(basename "$apk")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: $EXPECTED_PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          echo '- Android Auto manifest entries: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Actual car compatibility must be tested on device.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoMediaX-AndroidAuto-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
