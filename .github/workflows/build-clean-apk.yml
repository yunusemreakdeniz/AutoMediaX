name: Build privacy-clean APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
      - uses: gradle/actions/setup-gradle@v4
      - name: Check UI and performance scope
        run: python3 scripts/verify_ui_performance_scope.py
      - name: Check source endpoints
        run: python3 scripts/verify_no_external_ai.py
      - name: Build universal Android Auto debug APK
        run: bash gradlew verifyWebOnlyProductionGraph :fermata:packageAutoDebugUniversalApk --console=plain
      - name: Verify APK endpoints
        run: python3 scripts/verify_no_external_ai.py fermata/build/outputs/apk_from_bundle/autoDebug/*-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoMediaX-privacy-clean-APK
          path: fermata/build/outputs/apk_from_bundle/autoDebug/*-universal.apk
